<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character & Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>✨ Word & Character Counter</h1>
        <p class="subtitle">Your words, your thoughts, your little world 💗</p>
        <textarea
            id="textInput"
            placeholder="Start typing something beautiful..."
        ></textarea>
        <div class="counter-box">
            <div class="counter">
                <span id="charCount">0</span>
                <p>Characters</p>
            </div>
            <div class="counter">
                <span id="wordCount">0</span>
                <p>Words</p>
            </div>
            <div class="counter">
                <span id="sentenceCount">0</span>
                <p>Sentences</p>
            </div>
        </div>
        <button id="clearBtn">Clear Text 🧹</button>
        <p class="footer">Made with 💕 and a little bit of code</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
